<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Klubuntu | Project Showcase</title>
  <style>
    :root {
      --bg: #090b12;
      --surface: #121724;
      --surface-2: #1b2436;
      --text: #e9eeff;
      --muted: #a4b2d0;
      --accent: #7aa2ff;
      --accent-2: #5ce1e6;
      --border: #2b3852;
      --shadow: 0 14px 40px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(122, 162, 255, .18), transparent),
        radial-gradient(900px 450px at 100% 0%, rgba(92, 225, 230, .14), transparent),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .wrap {
      width: min(1100px, 92vw);
      margin: 0 auto;
      padding: 56px 0 80px;
    }

    .hero {
      background: linear-gradient(170deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02));
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(4px);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-2);
      background: rgba(92, 225, 230, .12);
      border: 1px solid rgba(92, 225, 230, .3);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      letter-spacing: .02em;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3.6vw, 3.5rem);
      line-height: 1.06;
      letter-spacing: -0.03em;
    }

    .lead {
      margin: 0;
      max-width: 70ch;
      color: var(--muted);
      font-size: clamp(1rem, 1.3vw, 1.12rem);
      line-height: 1.7;
    }

    .section-head {
      margin: 36px 2px 16px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
    }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.7rem);
      letter-spacing: -.01em;
    }

    .section-head p {
      margin: 0;
      color: var(--muted);
      font-size: .95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 220px;
      transition: transform .2s ease, border-color .2s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #3a4d75;
    }

    .meta {
      display: inline-block;
      width: fit-content;
      font-size: 12px;
      color: var(--accent);
      background: rgba(122, 162, 255, .12);
      border: 1px solid rgba(122, 162, 255, .3);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .card h3 {
      margin: 0;
      font-size: 1.13rem;
      letter-spacing: -.01em;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: .95rem;
      flex-grow: 1;
    }

    .card .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card a {
      text-decoration: none;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: .88rem;
      background: rgba(255, 255, 255, .02);
    }

    .card a:hover {
      border-color: #4b5e84;
    }

    footer {
      margin-top: 26px;
      color: var(--muted);
      font-size: .86rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="pill"><span role="img" aria-label="rocket">🚀</span> Project Showcase • Modern Layout</div>
      <h1>Klubuntu’s Best Projects</h1>
      <p class="lead">
        A curated portfolio pulled from all Klubuntu GitHub repositories, featuring the strongest projects
        first with a clean, responsive 21st-century layout.
      </p>
    </section>

    <div class="section-head">
      <h2>Featured Work</h2>
      <p id="project-count">Scanning repositories…</p>
    </div>

    <section id="projects" class="grid" aria-live="polite"></section>
    <footer>Built for klubuntu.github.io</footer>
  </main>

  <script>
    const container = document.getElementById("projects");
    const count = document.getElementById("project-count");

    function rankRepository(repo) {
      const stars = repo.stargazers_count || 0;
      const forks = repo.forks_count || 0;
      const watchers = repo.watchers_count || 0;
      const updatedAt = new Date(repo.updated_at).getTime() || 0;
      const daysSinceUpdate = Math.max(0, (Date.now() - updatedAt) / (1000 * 60 * 60 * 24));
      const recencyBonus = Math.max(0, 120 - daysSinceUpdate) / 20;
      return stars * 10 + forks * 4 + watchers + recencyBonus;
    }

    function createCard(project) {
      const card = document.createElement("article");
      card.className = "card";

      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = project.category;

      const heading = document.createElement("h3");
      heading.textContent = project.name;

      const description = document.createElement("p");
      description.textContent = project.description;

      const actions = document.createElement("div");
      actions.className = "actions";

      const repoLink = document.createElement("a");
      repoLink.href = project.repoUrl;
      repoLink.textContent = "Repository";
      repoLink.rel = "noopener noreferrer";
      repoLink.target = "_blank";
      actions.appendChild(repoLink);

      if (project.homepage) {
        const homeLink = document.createElement("a");
        homeLink.href = project.homepage;
        homeLink.textContent = "Live";
        homeLink.rel = "noopener noreferrer";
        homeLink.target = "_blank";
        actions.appendChild(homeLink);
      }

      card.append(meta, heading, description, actions);
      container.appendChild(card);
    }

    async function loadProjects() {
      try {
        const username = "Klubuntu";
        // Fetch up to 100 repos to rank globally before selecting the top showcase entries.
        const response = await fetch(`https://api.github.com/users/${username}/repos?per_page=100&sort=updated`);
        if (!response.ok) throw new Error("Failed to fetch repositories");

        const repositories = await response.json();
        const best = repositories
          .filter(repo => !repo.fork && !repo.archived && !repo.disabled)
          .sort((a, b) => rankRepository(b) - rankRepository(a))
          .slice(0, 12)
          .map(repo => ({
            name: repo.name,
            category: repo.language ? `${repo.language} • ${repo.stargazers_count} ${repo.stargazers_count === 1 ? "star" : "stars"}` : `Project • ${repo.stargazers_count} ${repo.stargazers_count === 1 ? "star" : "stars"}`,
            description: repo.description || "No description provided yet.",
            repoUrl: repo.html_url,
            homepage: repo.homepage || ""
          }));

        count.textContent = `${best.length} featured projects from all repositories`;
        best.forEach(createCard);
      } catch (error) {
        count.textContent = "Unable to load repositories (possible rate limit or network issue).";
        const fallback = document.createElement("article");
        fallback.className = "card";

        const heading = document.createElement("h3");
        heading.textContent = "Repository scan unavailable";

        const description = document.createElement("p");
        description.textContent = "Try refreshing, or open the GitHub profile directly.";

        const actions = document.createElement("div");
        actions.className = "actions";

        const profileLink = document.createElement("a");
        profileLink.href = "https://github.com/Klubuntu?tab=repositories";
        profileLink.textContent = "Open repositories";
        profileLink.rel = "noopener noreferrer";
        profileLink.target = "_blank";
        actions.appendChild(profileLink);

        fallback.append(heading, description, actions);
        container.appendChild(fallback);
        console.error(error);
      }
    }

    loadProjects();
  </script>
</body>
</html>
